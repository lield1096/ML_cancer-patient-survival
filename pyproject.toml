[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "survival-predictor"
version = "1.0.0"
description = "Leak-free ML pipeline and REST API for predicting cancer patient survival status."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Liel Dadush" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
survival-predictor = "survival_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# Capitalised X / X_train is the standard scikit-learn convention for feature matrices.
ignore = ["N803", "N806"]
