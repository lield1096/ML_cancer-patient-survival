name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=survival_predictor --cov-report=term-missing --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (trains model during build)
        run: docker build -t survival-predictor .
      - name: Smoke-test the running API
        run: |
          docker run -d -p 8000:8000 --name api survival-predictor
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"age":55,"tumor_size":30,"regional_nodes_examined":14,"regional_nodes_positive":3}'
